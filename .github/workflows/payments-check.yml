name: Validate payment backend
on:
  pull_request:
    paths: ['services/vendas/**', '.github/workflows/payments-check.yml']
  push:
    branches: [main]
    paths: ['services/vendas/**', '.github/workflows/payments-check.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vendas
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/vendas/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
